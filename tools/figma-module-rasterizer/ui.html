<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module Rasterizer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--figma-color-bg, #ffffff);
        --text: var(--figma-color-text, #1f1f1f);
        --muted: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #dedede);
        --hover: var(--figma-color-bg-hover, #f5f5f5);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d92d20);
        --panel: var(--figma-color-bg-secondary, #f7f7f7);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        font: 12px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      button,
      select,
      input {
        font: inherit;
      }

      .shell {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        height: 560px;
      }

      header {
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      .selected {
        display: grid;
        gap: 4px;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      .selected-name {
        overflow: hidden;
        font-weight: 650;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta {
        color: var(--muted);
      }

      .controls {
        display: grid;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .row > label {
        color: var(--muted);
      }

      select {
        height: 30px;
        min-width: 84px;
        padding: 0 8px;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
      }

      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text);
      }

      .button-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button {
        height: 32px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 7px;
        color: var(--text);
        background: var(--bg);
        cursor: pointer;
      }

      button:hover {
        background: var(--hover);
      }

      button.primary {
        border-color: var(--brand);
        color: var(--brand-text);
        background: var(--brand);
      }

      button.primary:hover {
        filter: brightness(0.96);
      }

      button:disabled {
        cursor: default;
        opacity: 0.48;
      }

      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 16px 7px;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }

      .link {
        height: auto;
        padding: 0;
        border: 0;
        color: var(--brand);
        background: transparent;
      }

      .list {
        overflow: auto;
      }

      .item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        width: 100%;
        height: auto;
        padding: 10px 16px;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        text-align: left;
        background: transparent;
      }

      .item:hover,
      .item.selected-item {
        background: var(--hover);
      }

      .item-name {
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-path {
        overflow: hidden;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pill {
        align-self: center;
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        background: var(--bg);
      }

      .empty,
      .error {
        padding: 18px 16px;
        color: var(--muted);
      }

      .error {
        color: var(--danger);
      }

      footer {
        min-height: 30px;
        padding: 7px 16px;
        color: var(--muted);
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Module Rasterizer</h1>
        <section class="selected" id="selected">
          <div class="selected-name">No layer selected</div>
          <div class="meta">Select a module on the canvas</div>
        </section>
      </header>

      <section class="controls">
        <div class="row">
          <label for="scale">Scale</label>
          <select id="scale">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
          <label class="check">
            <input id="keepOriginal" type="checkbox" checked />
            Keep source hidden
          </label>
        </div>
        <div class="button-row">
          <button id="download">Download PNG</button>
          <button id="replace" class="primary">Replace with PNG</button>
        </div>
      </section>

      <section class="list">
        <div class="list-head">
          <span id="count">0 modules</span>
          <button class="link" id="rescan">Refresh</button>
        </div>
        <div id="items"></div>
      </section>

      <footer id="status">Ready</footer>
    </main>

    <script>
      const selectedEl = document.getElementById("selected");
      const itemsEl = document.getElementById("items");
      const countEl = document.getElementById("count");
      const statusEl = document.getElementById("status");
      const scaleEl = document.getElementById("scale");
      const keepOriginalEl = document.getElementById("keepOriginal");
      const downloadEl = document.getElementById("download");
      const replaceEl = document.getElementById("replace");
      const rescanEl = document.getElementById("rescan");

      let selected = null;
      let candidates = [];

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;

        if (message.type === "state") {
          selected = message.selected;
          candidates = message.candidates;
          render();
          setStatus("Ready");
        }

        if (message.type === "download") {
          downloadBytes(message.fileName, message.bytes);
          setStatus(`Downloaded ${message.fileName}`);
        }

        if (message.type === "error") {
          setStatus(message.message, true);
        }
      };

      downloadEl.addEventListener("click", () => {
        post({
          type: "download",
          id: selected?.id,
          scale: getScale()
        });
        setStatus("Exporting PNG...");
      });

      replaceEl.addEventListener("click", () => {
        post({
          type: "replace",
          id: selected?.id,
          scale: getScale(),
          keepOriginal: keepOriginalEl.checked
        });
        setStatus("Replacing layer...");
      });

      rescanEl.addEventListener("click", () => {
        post({ type: "scan" });
        setStatus("Refreshing...");
      });

      function render() {
        renderSelection();
        renderList();
        const hasSelection = Boolean(selected);
        downloadEl.disabled = !hasSelection;
        replaceEl.disabled = !hasSelection;
      }

      function renderSelection() {
        if (!selected) {
          selectedEl.innerHTML = `
            <div class="selected-name">No layer selected</div>
            <div class="meta">Select a module on the canvas</div>
          `;
          return;
        }

        selectedEl.innerHTML = `
          <div class="selected-name" title="${escapeHtml(selected.path)}">${escapeHtml(selected.name)}</div>
          <div class="meta">${selected.type} · ${selected.width}×${selected.height}</div>
        `;
      }

      function renderList() {
        countEl.textContent = `${candidates.length} modules`;

        if (candidates.length === 0) {
          itemsEl.innerHTML = `<div class="empty">No exportable modules found</div>`;
          return;
        }

        itemsEl.innerHTML = "";
        const fragment = document.createDocumentFragment();

        for (const candidate of candidates) {
          const button = document.createElement("button");
          button.className = `item${candidate.selected ? " selected-item" : ""}`;
          button.style.paddingLeft = `${16 + Math.min(candidate.depth, 6) * 10}px`;
          button.title = candidate.path;
          button.innerHTML = `
            <span>
              <span class="item-name">${escapeHtml(candidate.name)}</span>
              <span class="item-path">${escapeHtml(candidate.type)} · ${candidate.width}×${candidate.height}</span>
            </span>
            <span class="pill">Focus</span>
          `;
          button.addEventListener("click", () => {
            post({ type: "focus", id: candidate.id });
            setStatus(`Focused ${candidate.name}`);
          });
          fragment.appendChild(button);
        }

        itemsEl.appendChild(fragment);
      }

      function post(pluginMessage) {
        parent.postMessage({ pluginMessage }, "*");
      }

      function getScale() {
        return Number(scaleEl.value);
      }

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = isError ? "error" : "";
      }

      function downloadBytes(fileName, bytes) {
        const blob = new Blob([new Uint8Array(bytes)], { type: "image/png" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
